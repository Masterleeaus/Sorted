name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Branch protection requires all five jobs to pass before merge to main:
#   lint · typecheck · build · test · e2e-smoke
#
# See docs/CI_GOVERNANCE.md for the full branch protection policy and
# recovery procedures.
# ---------------------------------------------------------------------------

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ESLint across all workspaces
        run: pnpm lint
      - name: Check Titan donor manifest checksums
        run: pnpm check:titan-manifest
      - name: Validate backup, restore and restore-drill shell syntax
        run: bash -n scripts/backup-garonhome.sh scripts/restore-garonhome.sh scripts/verify-backup-garonhome.sh scripts/lib/backup-policy.sh scripts/lib/backup-archive-safety.sh
      - name: Validate migration and seed shell syntax
        run: bash -n scripts/db-migrate.sh scripts/deploy-garonhome.sh scripts/deploy.sh scripts/healthcheck-garonhome.sh scripts/db-seed.sh scripts/lib/migration-safety.sh scripts/lib/deploy-safety.sh
      - name: Cryptographic offsite verification and restore safety regressions
        # Independent of unit/integration DB fixtures. Remote hash mismatches
        # and safe retention require explicit simulated failure coverage.
        run: node --test scripts/tests/offsite-*.test.mjs scripts/tests/restore-companion-format.test.mjs scripts/tests/scratch-restore-safety.test.mjs
      - name: Backup concurrency and encrypted local integrity regression tests
        run: node --test scripts/tests/backup-lock.test.mjs scripts/tests/audit-backup-local.test.mjs
      - name: Execute public intake media image and filesystem unit tests
        # Real Vitest execution of validation and private-file helpers; does not
        # depend on the currently missing native SQLite SQL donor files.
        run: pnpm --filter @ai-fsm/web exec vitest run intake-photo-
      - name: Public intake and staff photo route unit suites
        # Exercises existing upload/delete tests and authenticated staff APIs
        # independently of the native SQLite storage test blocker.
        run: pnpm --filter @ai-fsm/web exec vitest run media.unit.test.ts list.unit.test.ts download.unit.test.ts
      - name: Public intake media security and lifecycle contracts
        # Guard the token/tenant/photo race and private-upload requirements.
        run: node --test scripts/tests/intake-photo-*.test.mjs
      - name: Backup and restore failure-path regression tests
        # Independent of the inherited Knip debt; must run on every change.
        run: node --test scripts/tests/*.test.mjs
      - name: Dead-code check (knip)
        # Enforces the dead-code floor inside a required check, not only local gate.sh:
        # unused files/dependencies fail here so a bypassed local gate can't merge them.
        # knip loads vitest configs to detect test entrypoints; the *.integration
        # configs throw on CI unless these are present (presence check only, no DB).
        env:
          TEST_DATABASE_URL: postgresql://knip@localhost:5432/knip
          TEST_BASE_URL: http://localhost:3000
        run: pnpm knip
      - name: Reject new duplicate migration prefixes
        run: |
          node scripts/check-migration-prefixes.mjs
          node --test scripts/*.test.mjs

  # ── 2. Typecheck ─────────────────────────────────────────────────────────
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Node 24 GitHub Actions major versions
        run: |
          node scripts/check-action-runtime.mjs
          node --test scripts/check-action-runtime.test.mjs
      - name: Run tsc --noEmit across all workspaces
        run: pnpm typecheck
      - name: Verify onboarding runtime contract independently of storage migrations
        run: pnpm --filter @titan-zero/onboarding test
      - name: Verify notification redirect isolation independently of storage migrations
        run: pnpm --filter @ai-fsm/web exec vitest run __tests__/service-worker-security.unit.test.ts lib/push/__tests__/payload.unit.test.ts
      - name: Verify Sorted Field owner-alert email identity independently of storage migrations
        run: pnpm --filter @ai-fsm/web exec vitest run lib/attention/__tests__/email.unit.test.ts
      - name: Verify worker queue tenant isolation and failed delivery retries
        run: pnpm --filter @ai-fsm/worker exec vitest run src/notification/enqueue.test.ts src/workflow-events.test.ts
      - name: Verify customer HTML emails and portal login escaping without storage migrations
        run: |
          pnpm --filter @ai-fsm/email-templates test
          pnpm --filter @ai-fsm/web exec vitest run lib/email/__tests__/portal-magic-link.test.ts

  # ── 3. Build ─────────────────────────────────────────────────────────────
  # Runs after typecheck. Lint remains independently required for merge; a
  # pre-existing Knip finding must not mask build regressions.
  # Uses NEXT_PHASE to trigger the build-time
  # env bypass in apps/web/lib/env.ts so real secrets are not required in CI.
  build:
    name: build
    needs: [typecheck]
    runs-on: ubuntu-latest
    env:
      # Signal to env.ts that this is a build-time invocation.
      # Real secrets are NOT needed during `next build` (pages are force-dynamic).
      NEXT_PHASE: phase-production-build
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-
      - name: Build all workspaces
        run: pnpm build

  # ── 4. Test ──────────────────────────────────────────────────────────────
  # Runs after typecheck (parallel with build). Lint remains a required
  # independent gate; existing unused-file debt must not mask test failures.
  #
  # Environment provided:
  #   DATABASE_URL / TEST_DATABASE_URL  — PostgreSQL 16 container started in a setup step
  #                                       (random password in PGPASSWORD, never in a URL)
  #   AUTH_SECRET                       — Required by env.ts (≥32 chars)
  #
  # Runs unit, direct-DB, and HTTP integration suites. E2E has its own job.
  test:
    name: test
    needs: [typecheck]
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://test@localhost:5432/aifsm_test
      TEST_RUNTIME_DATABASE_URL: postgresql://ai_fsm_web@localhost:5432/aifsm_test
      LOCATION_INTERNAL_KEY: ci-internal-test-only
      DATABASE_URL: postgresql://test@localhost:5432/aifsm_test
      # Required by env.ts (≥32 chars). This is a CI-only test secret.
      AUTH_SECRET: ci-test-only-secret-not-used-in-production!!
      TEST_BASE_URL: http://localhost:3000
      E2E_SKIP_EMAIL_DELIVERY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL 16 with a per-job random password
        # GitHub service containers are created before any step runs, so the password
        # cannot come from a step. Start the container here instead.
        run: |
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "PGPASSWORD=$pw" >> "$GITHUB_ENV"
          echo "RUNTIME_DB_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run -d --name aifsm-pg -p 5432:5432 \
            -e POSTGRES_USER=test -e POSTGRES_DB=aifsm_test -e POSTGRES_PASSWORD="$pw" \
            postgres:16 >/dev/null
          for _ in $(seq 1 30); do
            if PGPASSWORD="$pw" psql -h localhost -U test -d aifsm_test -c "select 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      - name: Apply schema migrations
        run: |
          for file in db/migrations/*.sql; do
            if [[ "$file" == *"seed"* ]]; then continue; fi
            echo "applying: $file"
            psql -h localhost -U test -d aifsm_test -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Apply seed data
        run: psql -h localhost -U test -d aifsm_test -v ON_ERROR_STOP=1 -f db/migrations/002_seed_dev.sql

      - name: Provision restricted test database role
        env:
          MIGRATION_DATABASE_URL: postgresql://test@localhost:5432/aifsm_test
        run: bash scripts/db-provision-runtime.sh

      - name: Verify intake media tenant constraints and public-photo lifecycle against PostgreSQL
        # Execute before the native SQLite suite. Missing native donor SQL must
        # not hide a failed cross-tenant PostgreSQL regression.
        run: pnpm --filter @ai-fsm/web exec vitest run --config vitest.integration.config.ts app/api/intake
      - name: Diagnose attested SQLite source availability
        # Diagnostic only. The required unit test gate still runs unmodified.
        continue-on-error: true
        run: node scripts/check-native-sqlite-provenance.mjs
      - name: Run unit tests
        run: pnpm test:unit

      - name: Run database and HTTP integration tests
        run: |
          pnpm --filter @ai-fsm/web dev > /tmp/integration-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/integration-server.log' EXIT
          for attempt in {1..60}; do
            kill -0 "$server_pid" || exit 1
            if curl --silent --fail "$TEST_BASE_URL/api/health" > /dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail "$TEST_BASE_URL/api/health"
          pnpm test:integration

  # ── 5. Required E2E Smoke (Playwright) ───────────────────────────────────
  # Release-manifest smoke: login -> client -> job -> visit -> estimate ->
  # invoice -> payment. This is intentionally narrow and required.
  e2e-smoke:
    name: e2e-smoke
    needs: [build, test]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test@localhost:5432/aifsm_test
      AUTH_SECRET: ci-e2e-test-secret-not-used-in-production!!
      TEST_BASE_URL: http://localhost:3000
      PLAYWRIGHT_USE_EXTERNAL_SERVER: "1"
      E2E_DISABLE_LOGIN_RATE_LIMIT: "1"
      E2E_SKIP_EMAIL_DELIVERY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start PostgreSQL 16 with a per-job random password
        # GitHub service containers are created before any step runs, so the password
        # cannot come from a step. Start the container here instead.
        run: |
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "PGPASSWORD=$pw" >> "$GITHUB_ENV"
          echo "RUNTIME_DB_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run -d --name aifsm-pg -p 5432:5432 \
            -e POSTGRES_USER=test -e POSTGRES_DB=aifsm_test -e POSTGRES_PASSWORD="$pw" \
            postgres:16 >/dev/null
          for _ in $(seq 1 30); do
            if PGPASSWORD="$pw" psql -h localhost -U test -d aifsm_test -c "select 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      - name: Apply schema migrations
        run: |
          for file in db/migrations/*.sql; do
            if [[ "$file" == *"seed"* ]]; then continue; fi
            echo "applying: $file"
            psql -h localhost -U test -d aifsm_test -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Apply seed data
        run: psql -h localhost -U test -d aifsm_test -v ON_ERROR_STOP=1 -f db/migrations/002_seed_dev.sql

      - name: Build production app
        env:
          NEXT_PHASE: phase-production-build
        run: pnpm build

      - name: Start production server
        run: pnpm --filter @ai-fsm/web start &

      - name: Wait for server
        run: sleep 10 && curl -f http://localhost:3000/api/health

      - name: Run required release smoke
        run: pnpm exec playwright test tests/e2e/core-flow.spec.ts --reporter=list

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 7
